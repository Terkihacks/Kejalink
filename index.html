<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kenya's verified rental marketplace. Tell us what you need and we'll match you with trusted agents. No fake listings. Fast matching."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Typography:
        Plus Jakarta Sans — display headings, brand wordmark, hero copy
        Inter            — body text, UI labels, form inputs, badges
      Both loaded from Google Fonts. For a fully offline build, replace with @font-face declarations.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Deliberately render-blocking (not the media="print"/onload deferred-swap
      trick): this app is client-rendered, so the JS bundle is already doing
      heavy hydration work shortly after first paint. Deferring the font CSS
      meant it finished loading *during* that hydration window, and applying
      it there forced a page-wide style/layout recalc (font metrics changing)
      right on top of an already-busy main thread — measured as a ~1.1s Style
      & Layout main-thread task and 670ms Total Blocking Time. Blocking here
      costs ~650ms of render delay but keeps the font swap off the hydration
      critical path, which is the better trade for this specific app shape.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700;900&display=swap"
      rel="stylesheet"
    />

    <title>KejaLink — Find a House Without Stress</title>

    <!--
      Theme flash prevention: apply the saved theme class before React renders
      so the user never sees a flash of the wrong theme on page load.
    -->
    <script>
      (function () {
        var s = localStorage.getItem('keja-theme')
        var preferLight = window.matchMedia('(prefers-color-scheme: light)').matches
        if (s === 'light' || (!s && preferLight)) {
          document.documentElement.classList.add('light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
