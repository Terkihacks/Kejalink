    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Kenya's verified rental marketplace. Tell us what you need and we'll match you with trusted agents. No fake listings. Fast matching."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Typography:
        Plus Jakarta Sans — display headings, brand wordmark, hero copy
        Inter            — body text, UI labels, form inputs, badges
      Both loaded from Google Fonts. For a fully offline build, replace with @font-face declarations.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded non-render-blocking: the browser fetches this stylesheet at low
      priority (media="print" doesn't match screen, so it doesn't block first
      paint) then swaps it to "all" once loaded. font-display: swap on the
      Google Fonts side means text still renders immediately in a fallback
      font either way — this just stops the fetch itself from gating render.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700;900&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <title>KejaLink — Find a House Without Stress</title>

    <!--
      Theme flash prevention: apply the saved theme class before React renders
      so the user never sees a flash of the wrong theme on page load.
    -->
    <script>
      (function () {
        var s = localStorage.getItem('keja-theme')
        var preferLight = window.matchMedia('(prefers-color-scheme: light)').matches
        if (s === 'light' || (!s && preferLight)) {
          document.documentElement.classList.add('light')
        }
      })()
    </script>
